<section class="contact" id="contact">
  <div class="contact__inner">
    <span class="contact__eyebrow" appReveal>
      <span class="eyebrow__num">02</span>Let's connect
    </span>

    <h2 class="contact__title" appReveal [revealDelay]="100">
      Have a project <span class="grad">in mind?</span>
    </h2>

    <p class="contact__sub" appReveal [revealDelay]="200">
      Whether it's a full build, a tricky system to design, or AI to weave into
      your product — I'd love to hear about it.
    </p>

    <div class="contact__actions" appReveal [revealDelay]="300">
      <a class="btn btn--primary" [href]="mailto">Get in touch</a>
      <a class="btn btn--ghost" routerLink="/projects">
        Browse all projects
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </div>

    <div class="contact__socials" appReveal [revealDelay]="400">
      <a class="contact__social" href="#" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.5 2 2 6.6 2 12.3c0 4.5 2.9 8.3 6.8 9.7.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.4-3.4-1.4-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5 3.9-1.4 6.8-5.2 6.8-9.7C22 6.6 17.5 2 12 2z" />
        </svg>
      </a>
      <a class="contact__social" href="#" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.76-2.05C20.4 8.65 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.3-2-3.3s-2.3 1.57-2.3 3.2V21H9z" />
        </svg>
      </a>
      <a class="contact__social" [href]="mailto" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m2 7 10 6 10-6" />
        </svg>
      </a>
    </div>
  </div>

  <footer class="footer">
    <span class="footer__logo">Lana<span>.</span></span>
    <nav class="footer__nav">
      <a routerLink="/">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a routerLink="/projects">Projects</a>
    </nav>
    <span class="footer__copy">© {{ year }} Lana Touma</span>
  </footer>
</section>
