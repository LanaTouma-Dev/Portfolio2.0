<section class="contact" id="contact">
  <div class="contact__inner">

    <div class="contact__left" appReveal revealFrom="left">
      <span class="contact__eyebrow">Let's connect</span>
      <h2 class="contact__title">Have a project<br />in mind?</h2>
    </div>

    <div class="contact__right" appReveal revealFrom="right" [revealDelay]="120">
      <p class="contact__sub">
        Whether it's a full build, a tricky system to design, or AI to weave
        into your product, I'd love to hear about it.
      </p>
      <div class="contact__actions">
        <a class="contact__cta" [href]="mailto">Get in touch</a>
        <div class="contact__links">
          <a href="https://github.com/lanatouma" target="_blank" rel="noopener">GitHub</a>
          <a href="https://linkedin.com/in/lanatouma" target="_blank" rel="noopener">LinkedIn</a>
          <a [href]="mailto">Email</a>
        </div>
      </div>
    </div>

  </div>

  <footer class="footer">
    <span class="footer__logo">Lana<span>.</span></span>
    <span class="footer__tagline">Full Stack &amp; AI Engineer</span>
    <span class="footer__copy">© {{ year }} Lana Touma</span>
  </footer>
</section>
